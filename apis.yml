name: Rapportive
description: >-
  Rapportive was a browser extension that added a contact-intelligence sidebar to
  Gmail, surfacing a person's name, photo, job, and social profiles alongside their
  email. Founded in 2011 and backed by 500 Global (then 500 Startups), it was
  acquired by LinkedIn in 2012 and later folded into LinkedIn Sales Navigator. The
  rapportive.com domain now 301-redirects to LinkedIn's "Sales Navigator for Gmail"
  feature page. Rapportive published no standalone developer API and operates no
  independent developer surface today; this profile records that defunct/absorbed
  status for the API Evangelist network.
